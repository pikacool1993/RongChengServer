<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or "后台管理" }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --card-radius: 14px; }
    body { background: #f6f7fb; }
    .card, .table { border-radius: var(--card-radius); }
    .shadow-soft { box-shadow: 0 10px 30px rgba(16, 24, 40, .08); }
    .navbar { box-shadow: 0 6px 20px rgba(0,0,0,.08); }
    code { background: rgba(13,110,253,.08); padding: .1rem .35rem; border-radius: .35rem; }
  </style>
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand fw-semibold" href="/admin-ui/orders">后台管理</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-expanded="false">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="/admin-ui/orders">订单</a></li>
          <li class="nav-item"><a class="nav-link" href="/admin-ui/users">用户</a></li>
        </ul>
        <form method="post" action="/admin-ui/logout" class="d-flex">
          <button class="btn btn-outline-light btn-sm" type="submit">退出</button>
        </form>
      </div>
    </div>
  </nav>
  <main class="container-xxl py-4">
    {% block content %}{% endblock %}
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
