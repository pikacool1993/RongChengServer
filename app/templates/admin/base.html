<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or "后台管理" }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f6f9;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --border: #dbe3ee;
      --text: #172033;
      --muted: #687587;
      --primary: #2563eb;
      --primary-dark: #1e40af;
      --danger: #dc2626;
      --radius: 8px;
      --shadow: 0 10px 28px rgba(15, 23, 42, .08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
    }

    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 232px minmax(0, 1fr);
    }

    .sidebar {
      background: #111827;
      color: #e5e7eb;
      padding: 20px 14px;
      position: sticky;
      top: 0;
      height: 100vh;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px 20px;
      color: #fff;
      font-size: 17px;
      font-weight: 700;
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: var(--primary);
      color: #fff;
      font-weight: 800;
    }

    .nav-stack {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .nav-stack a {
      color: #cbd5e1;
      text-decoration: none;
      padding: 10px 12px;
      border-radius: 8px;
      font-weight: 600;
    }

    .nav-stack a:hover,
    .nav-stack a.active {
      background: rgba(37, 99, 235, .18);
      color: #fff;
    }

    .logout-form {
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, .1);
    }

    .logout-form .btn {
      width: 100%;
      border-color: rgba(255, 255, 255, .22);
      color: #f8fafc;
    }

    .content {
      min-width: 0;
      padding: 24px;
    }

    .page-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .page-panel-header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 14px;
    }

    .page-title {
      margin: 0;
      font-size: 20px;
      font-weight: 750;
      letter-spacing: 0;
    }

    .page-subtitle {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }

    .toolbar {
      padding: 16px 20px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
    }

    .form-control,
    .form-select {
      border-color: var(--border);
      border-radius: 7px;
      min-height: 38px;
      font-size: 13px;
    }

    .btn {
      border-radius: 7px;
      font-weight: 650;
      letter-spacing: 0;
    }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
    }

    .btn-primary:hover {
      background: var(--primary-dark);
      border-color: var(--primary-dark);
    }

    code {
      background: #eef4ff;
      color: #174ea6;
      border: 1px solid #d8e6ff;
      border-radius: 6px;
      padding: 2px 6px;
      font-size: 12px;
    }

    .table {
      margin: 0;
      color: var(--text);
    }

    .table thead th {
      background: #f8fafc;
      color: #475569;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      font-weight: 750;
      text-transform: none;
    }

    .table tbody td {
      border-color: #edf2f7;
    }

    @media (max-width: 900px) {
      .app-shell {
        display: block;
      }

      .sidebar {
        position: static;
        height: auto;
      }

      .nav-stack {
        flex-direction: row;
        flex-wrap: wrap;
      }

      .logout-form {
        margin-top: 10px;
        padding-top: 10px;
      }

      .logout-form .btn {
        width: auto;
      }

      .content {
        padding: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">票</div>
        <div>票务后台</div>
      </div>
      <nav class="nav-stack">
        <a href="/admin-ui/orders" class="{% if request.url.path.startswith('/admin-ui/orders') %}active{% endif %}">订单管理</a>
        <a href="/admin-ui/users" class="{% if request.url.path.startswith('/admin-ui/users') %}active{% endif %}">用户密钥</a>
        <a href="/admin-ui/configs" class="{% if request.url.path.startswith('/admin-ui/configs') %}active{% endif %}">比赛公告</a>
      </nav>
      <form method="post" action="/admin-ui/logout" class="logout-form">
        <button class="btn btn-outline-light btn-sm" type="submit">退出登录</button>
      </form>
    </aside>
    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
