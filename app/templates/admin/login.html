<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管理员登录</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, rgba(13,110,253,.18), rgba(32,201,151,.14));
      background-attachment: fixed;
    }
    .login-card { border: 0; border-radius: 16px; }
  </style>
</head>
<body>
  <main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
    <div class="card login-card shadow-soft w-100" style="max-width: 520px;">
      <div class="card-body">
        <div class="text-center mb-4">
          <div class="fw-semibold fs-4">管理员登录</div>
          <div class="text-muted small">请输入后台口令</div>
        </div>
        {% if error %}
          <div class="alert alert-danger">{{ error }}</div>
        {% endif %}
        <form method="post" action="/admin-ui/login" class="mx-auto" style="max-width: 420px;">
          <input type="hidden" name="next" value="{{ next }}">
          <div class="mb-3">
            <label class="form-label">口令</label>
            <input class="form-control form-control-lg" type="password" name="password" required autofocus>
          </div>
          <button class="btn btn-primary btn-lg w-100" type="submit">登录</button>
        </form>
      </div>
    </div>
  </main>
</body>
</html>
