{% extends "admin/base.html" %}
{% block content %}
  <div class="card border-0 shadow-soft" style="max-width: 820px;">
    <div class="card-body">
    <div class="d-flex flex-wrap align-items-end justify-content-between gap-2 mb-3">
      <div>
        <div class="fw-semibold fs-5">编辑用户</div>
        <div class="text-muted small">API Key：<code>{{ user.api_key }}</code></div>
      </div>
      <div class="d-flex gap-2">
        <a class="btn btn-outline-secondary btn-sm" href="/admin-ui/users">返回列表</a>
        <a class="btn btn-outline-info btn-sm" href="/admin-ui/users/{{ user.api_key }}/devices">查看设备</a>
      </div>
    </div>
    <div class="mb-3">
      <div class="text-muted">API Key</div>
      <div><code>{{ user.api_key }}</code></div>
    </div>
    <form method="post" action="/admin-ui/users/{{ user.api_key }}/update" class="row g-2">
      <div class="col-md-6">
        <label class="form-label">Name</label>
        <input class="form-control" name="name" value="{{ user.name or '' }}">
      </div>
      <div class="col-md-6">
        <label class="form-label">Lark Key</label>
        <input class="form-control" name="lark_key" value="{{ user.lark_key or '' }}" placeholder="飞书key">
      </div>
      <div class="col-md-3">
        <label class="form-label">Max Devices</label>
        <input class="form-control" name="max_devices" type="number" min="1" value="{{ user.max_devices }}">
      </div>
      <div class="col-md-3 d-grid align-items-end">
        <button class="btn btn-primary mt-4" type="submit">保存</button>
      </div>
    </form>
    </div>
  </div>
{% endblock %}
