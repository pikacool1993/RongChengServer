{% extends "admin/base.html" %}
{% block content %}
  <div class="card border-0 shadow-soft" style="max-width: 880px;">
    <div class="card-body">
      <div class="d-flex flex-wrap align-items-end justify-content-between gap-2 mb-3">
        <div>
          <div class="fw-semibold fs-5">编辑配置</div>
          <div class="text-muted small">ID：<span class="text-muted">{{ config.id }}</span></div>
        </div>
        <a class="btn btn-outline-secondary btn-sm" href="/admin-ui/configs">返回列表</a>
      </div>

      {% if error %}
        <div class="alert alert-warning">{{ error }}</div>
      {% endif %}

      <form method="post" action="/admin-ui/configs/{{ config.id }}/update">
        <div class="mb-3">
          <label class="form-label">match_id</label>
          <input class="form-control" name="match_id" type="number" required value="{{ config.match_id }}">
        </div>
        <div class="mb-3">
          <label class="form-label">content（最多 1024 字）</label>
          <textarea class="form-control" name="content" rows="6" maxlength="1024">{{ config.content or '' }}</textarea>
        </div>
        <button class="btn btn-primary" type="submit">保存</button>
      </form>
    </div>
  </div>
{% endblock %}
