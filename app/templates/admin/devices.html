{% extends "admin/base.html" %}
{% block content %}
  <div class="card border-0 shadow-soft">
    <div class="card-body">
    <div class="d-flex flex-wrap align-items-end justify-content-between gap-2 mb-3">
      <div>
        <div class="fw-semibold fs-5">设备</div>
        <div class="text-muted small">API Key：<code>{{ user.api_key }}</code></div>
      </div>
      <div>
        <a class="btn btn-outline-secondary btn-sm" href="/admin-ui/users">返回用户</a>
      </div>
    </div>
    <div class="table-responsive">
      <table class="table table-sm align-middle table-hover">
        <thead>
          <tr>
            <th>ID</th>
            <th>Device ID</th>
            <th>First Seen</th>
            <th>Last Seen</th>
            <th class="text-end">操作</th>
          </tr>
        </thead>
        <tbody>
          {% for d in devices %}
          <tr>
            <td class="text-muted">{{ d.id }}</td>
            <td><code>{{ d.device_id }}</code></td>
            <td class="text-muted">{{ d.first_seen }}</td>
            <td class="text-muted">{{ d.last_seen }}</td>
            <td class="text-end">
              <form method="post" action="/admin-ui/devices/{{ d.id }}/delete" class="d-inline"
                    onsubmit="return confirm('确认删除该设备？');">
                <input type="hidden" name="next" value="/admin-ui/users/{{ user.api_key }}/devices">
                <button class="btn btn-outline-danger btn-sm" type="submit">删除</button>
              </form>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
    </div>
  </div>
{% endblock %}
